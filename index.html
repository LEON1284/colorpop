<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>消消方块 - Canvas</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.game-container {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 24px 20px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.1);
}

.game-header { text-align: center; margin-bottom: 16px; }

.game-title {
  font-size: 32px; font-weight: 800;
  background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 2px; margin-bottom: 2px;
}

.game-subtitle { font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 1px; }

.info-bar {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px;
}

.info-item {
  background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 8px;
  text-align: center; border: 1px solid rgba(255,255,255,0.08);
}

.info-label {
  font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4px;
}

.info-value { font-size: 17px; font-weight: 700; color: #fff; }
.info-value.combo-active { color: #ff6b6b; animation: comboPulse 0.3s ease; }

@keyframes comboPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

.level-badge {
  display: inline-block; background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff; border-radius: 20px; padding: 4px 14px; font-size: 12px;
  font-weight: 600; letter-spacing: 1px; margin-bottom: 12px;
}

.board-wrapper {
  display: flex; justify-content: center; margin-bottom: 16px;
}

canvas#boardCanvas {
  border-radius: 16px;
  max-width: 100%;
  height: auto;
}

.btn {
  display: inline-block; padding: 10px 24px; border-radius: 12px; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer; letter-spacing: 1px;
  transition: all 0.2s ease;
}
.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
  box-shadow: 0 4px 15px rgba(102,126,234,0.4);
}

.btn-secondary {
  background: rgba(255,255,255,0.12); color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
}

.game-footer { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fff; padding: 10px 24px; border-radius: 20px;
  font-size: 14px; font-weight: 500; z-index: 200; pointer-events: none;
  opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }

@media (max-width: 400px) {
  .game-container { padding: 16px 10px 14px; }
  .game-title { font-size: 24px; }
  .info-bar { gap: 4px; }
  .info-item { padding: 8px 4px; }
  .info-value { font-size: 14px; }
}
</style>
</head>
<body>

<div class="game-container">
  <div class="game-header">
    <div class="game-title">消消方块</div>
    <div class="game-subtitle">ColorPop · Canvas 渲染版</div>
  </div>

  <div style="text-align:center;">
    <span class="level-badge" id="levelBadge">第 1 关</span>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <div class="info-label">目标</div>
      <div class="info-value" id="targetScore">500</div>
    </div>
    <div class="info-item">
      <div class="info-label">得分</div>
      <div class="info-value" id="currentScore">0</div>
    </div>
    <div class="info-item">
      <div class="info-label">Combo</div>
      <div class="info-value" id="comboCount">x0</div>
    </div>
    <div class="info-item">
      <div class="info-label">最高连击</div>
      <div class="info-value" id="maxCombo">0</div>
    </div>
  </div>

  <div class="board-wrapper">
    <canvas id="boardCanvas"></canvas>
  </div>

  <div class="game-footer">
    <button class="btn btn-secondary" onclick="resetGame()">重新开始</button>
    <button class="btn btn-primary" onclick="shareScore()">分享成绩</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// DOM 引用 — 集中管理，便于后续迁移到小程序 API
// ============================================================
const DOM = {};

function initDOM() {
  DOM.canvas = document.getElementById('boardCanvas');
  DOM.ctx = DOM.canvas.getContext('2d');
  DOM.scoreEl = document.getElementById('currentScore');
  DOM.targetEl = document.getElementById('targetScore');
  DOM.comboEl = document.getElementById('comboCount');
  DOM.maxComboEl = document.getElementById('maxCombo');
  DOM.levelBadge = document.getElementById('levelBadge');
  DOM.toastEl = document.getElementById('toast');
}

function getEl(id) {
  // 隔离 getElementById 便于后续替换
  return document.getElementById(id);
}

// ============================================================
// 常量 & Canvas 布局
// ============================================================
const ROWS = 8;
const COLS = 8;
const COLORS_ALL = 9;
const LEVEL_COLORS = [5, 5, 6, 6, 7, 7, 8, 8, 9];

// Canvas 绘制参数
const CELL_SIZE = 46;
const GAP = 3;
const PADDING = 8;
const BOARD_PX = CELL_SIZE * COLS + GAP * (COLS - 1) + PADDING * 2; // 405

// 颜色表（渐变起止色，对应原版 c0-c8）
const COLOR_GRADS = [
  ['#ff6b6b', '#ee5a24'], // c0 红
  ['#ffa502', '#e67e22'], // c1 橙
  ['#ffd700', '#f9ca24'], // c2 金
  ['#7bed9f', '#2ed573'], // c3 绿
  ['#70a1ff', '#1e90ff'], // c4 蓝
  ['#a55eea', '#8854d0'], // c5 紫
  ['#ff6b81', '#fc5c65'], // c6 粉
  ['#1abc9c', '#16a085'], // c7 青
  ['#f0932b', '#f368e0'], // c8 珊瑚
];

// ============================================================
// 游戏状态
// ============================================================
let board = [];
let score = 0;
let combo = 0;
let maxCombo = 0;
let level = 1;
let targetScore = 500;
let colorCount = 5;
let moveCount = 0;
let comboTimer = null;

// ============================================================
// 动画状态
// ============================================================
const anim = {
  phase: 'idle',        // 'idle' | 'popping' | 'dropping' | 'sliding'
  startTime: 0,
  duration: 0,
  prevBoard: null,       // 当前动画阶段之前的 board 快照
  clearedCells: [],      // [{r, c}] 被消除的格子
  dropCells: [],         // [{r, c}] 重力下落产生的新格子
  slideCols: new Set(),  // 左移压缩涉及的列
};

let scorePops = [];      // [{x, y, value, startTime, duration}]
let rafId = null;

// ============================================================
// Canvas 初始化
// ============================================================
function initCanvas() {
  const dpr = window.devicePixelRatio || 1;
  DOM.canvas.width = BOARD_PX * dpr;
  DOM.canvas.height = BOARD_PX * dpr;
  DOM.canvas.style.width = BOARD_PX + 'px';
  DOM.canvas.style.height = BOARD_PX + 'px';
  DOM.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============================================================
// 绘图工具函数
// ============================================================
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 获取格子当前应绘制的颜色索引（动画期间可能取 prevBoard）
function getCellColor(r, c) {
  if (anim.phase === 'popping' && isClearedCell(r, c)) {
    return anim.prevBoard ? anim.prevBoard[r][c] : -1;
  }
  return board[r][c];
}

function isClearedCell(r, c) {
  return anim.clearedCells.some(cc => cc[0] === r && cc[1] === c);
}

function isDropCell(r, c) {
  return anim.dropCells.some(dc => dc.r === r && dc.c === c);
}

// 绘制单个方块
function drawCell(ctx, x, y, colorIdx, alpha, scale) {
  const ci = colorIdx % COLORS_ALL;
  const [c1, c2] = COLOR_GRADS[ci];

  ctx.save();

  if (alpha !== undefined && alpha < 1) {
    ctx.globalAlpha = alpha;
  }

  if (scale !== undefined && scale !== 1) {
    const cx = x + CELL_SIZE / 2;
    const cy = y + CELL_SIZE / 2;
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.translate(-cx, -cy);
  }

  const grad = ctx.createLinearGradient(x, y, x + CELL_SIZE, y + CELL_SIZE);
  grad.addColorStop(0, c1);
  grad.addColorStop(1, c2);

  ctx.fillStyle = grad;
  ctx.shadowColor = c1;
  ctx.shadowBlur = 8;
  roundRect(ctx, x, y, CELL_SIZE, CELL_SIZE, 10);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

// ============================================================
// 绘图：drawBoard
// ============================================================
function drawBoard(progress) {
  const ctx = DOM.ctx;

  // 棋盘背景
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(ctx, 0, 0, BOARD_PX, BOARD_PX, 16);
  ctx.fill();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const colorIdx = getCellColor(r, c);
      if (colorIdx < 0) continue;

      let x = PADDING + c * (CELL_SIZE + GAP);
      let y = PADDING + r * (CELL_SIZE + GAP);
      let alpha = 1;
      let scale = 1;

      // ---- 弹除动画 ----
      if (anim.phase === 'popping' && isClearedCell(r, c)) {
        // easeOutQuad: t*(2-t)
        const t = progress;
        scale = 1 - t * (2 - t);
        alpha = 1 - t;
        if (alpha <= 0) continue;
      }

      // ---- 下落动画 ----
      if (anim.phase === 'dropping' && isDropCell(r, c)) {
        const t = elasticOut(progress);
        y -= (1 - t) * (CELL_SIZE + GAP);
      }

      // ---- 左移动画 ----
      if (anim.phase === 'sliding' && anim.slideCols.has(c)) {
        const t = elasticOut(progress);
        x -= (1 - t) * (CELL_SIZE + GAP);
      }

      drawCell(ctx, x, y, colorIdx, alpha, scale);
    }
  }
}

// ============================================================
// 绘图：drawScorePops（分数飘字）
// ============================================================
function drawScorePops(now) {
  const ctx = DOM.ctx;

  for (const sp of scorePops) {
    const elapsed = now - sp.startTime;
    const t = Math.min(elapsed / sp.duration, 1);
    const alpha = 1 - t;
    const offsetY = -80 * t;
    const scale = 1 + 0.5 * t;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(sp.x, sp.y + offsetY);
    ctx.scale(scale, scale);

    ctx.font = 'bold 20px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 金色带发光
    ctx.shadowColor = 'rgba(255,215,0,0.8)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffd700';
    ctx.fillText('+' + sp.value, 0, 0);
    ctx.shadowBlur = 0;

    ctx.restore();
  }
}

// ============================================================
// 绘图：drawFrame（静态绘制，用于 idle 和初始渲染）
// ============================================================
function drawFrame() {
  const ctx = DOM.ctx;
  ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);
  drawBoard(0);
}

// ============================================================
// 动画系统：animate / startPhase / completePhase
// ============================================================
function elasticOut(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1;
}

function startPhase(phase, duration) {
  anim.phase = phase;
  anim.startTime = performance.now();
  anim.duration = duration;

  if (!rafId) {
    rafId = requestAnimationFrame(animate);
  }
}

function animate(timestamp) {
  const ctx = DOM.ctx;

  if (anim.phase !== 'idle') {
    const elapsed = timestamp - anim.startTime;
    const progress = Math.min(elapsed / anim.duration, 1);

    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);
    drawBoard(progress);
    drawScorePops(timestamp);

    if (progress >= 1) {
      completePhase();
    }
  } else {
    // Idle 阶段：仅重绘以更新飘字
    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);
    drawBoard(0);
    drawScorePops(timestamp);
  }

  // 清理过期飘字
  for (let i = scorePops.length - 1; i >= 0; i--) {
    if (timestamp - scorePops[i].startTime > scorePops[i].duration) {
      scorePops.splice(i, 1);
    }
  }

  if (anim.phase !== 'idle' || scorePops.length > 0) {
    rafId = requestAnimationFrame(animate);
  } else {
    rafId = null;
  }
}

function completePhase() {
  switch (anim.phase) {
    case 'popping': {
      const prev = board.map(row => [...row]);
      applyGravity();
      anim.prevBoard = prev;
      anim.dropCells = diffNewCells(prev, board);
      anim.clearedCells = [];
      startPhase('dropping', 350);
      break;
    }
    case 'dropping': {
      const prev = board.map(row => [...row]);
      const slided = compressColumns();
      anim.prevBoard = prev;
      anim.slideCols = new Set(slided);
      anim.dropCells = [];
      startPhase('sliding', 300);
      break;
    }
    case 'sliding': {
      anim.phase = 'idle';
      anim.slideCols.clear();
      anim.prevBoard = null;
      resetComboAfterDelay();
      updateUI();

      if (!hasMoves()) {
        showToast('没有可消除的方块，重新洗牌...');
        setTimeout(() => {
          createBoard();
          ensureMoves();
          drawFrame();
        }, 500);
      }
      checkLevelUp();
      break;
    }
  }
}

// 对比两版 board，返回新增格子（old 为 -1 但 new >= 0）
function diffNewCells(oldBoard, newBoard) {
  const cells = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (oldBoard[r][c] === -1 && newBoard[r][c] >= 0) {
        cells.push({ r, c });
      }
    }
  }
  return cells;
}

function stopAnimation() {
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
  anim.phase = 'idle';
  anim.clearedCells = [];
  anim.dropCells = [];
  anim.slideCols.clear();
  anim.prevBoard = null;
  scorePops = [];
}

// ============================================================
// 工具：分数飘字
// ============================================================
function addScorePop(canvasX, canvasY, points) {
  scorePops.push({
    x: canvasX,
    y: canvasY,
    value: points,
    startTime: performance.now(),
    duration: 1000,
  });

  if (!rafId && anim.phase === 'idle') {
    rafId = requestAnimationFrame(animate);
  }
}

// ============================================================
// Toast
// ============================================================
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  DOM.toastEl.textContent = msg;
  DOM.toastEl.classList.add('show');
  toastTimer = setTimeout(() => DOM.toastEl.classList.remove('show'), 2000);
}

// ============================================================
// Canvas 点击 / 触摸处理
// ============================================================
function getBoardCoord(e) {
  const rect = DOM.canvas.getBoundingClientRect();
  const scaleX = DOM.canvas.width / rect.width;
  const scaleY = DOM.canvas.height / rect.height;
  const canvasX = (e.clientX - rect.left) * scaleX;
  const canvasY = (e.clientY - rect.top) * scaleY;

  const col = Math.floor((canvasX - PADDING) / (CELL_SIZE + GAP));
  const row = Math.floor((canvasY - PADDING) / (CELL_SIZE + GAP));

  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
  return { row, col };
}

function onCanvasClick(e) {
  const coord = getBoardCoord(e);
  if (!coord) return;
  onCellClick(coord.row, coord.col);
}

function onCanvasTouch(e) {
  e.preventDefault();
  const coord = getBoardCoord(e.changedTouches[0]);
  if (!coord) return;
  onCellClick(coord.row, coord.col);
}

// ============================================================
// 游戏逻辑（与原版完全一致）
// ============================================================
function getColorCount() {
  return LEVEL_COLORS[Math.min(level - 1, LEVEL_COLORS.length - 1)];
}

function randomColor() {
  return Math.floor(Math.random() * colorCount);
}

function createBoard() {
  board = [];
  colorCount = getColorCount();
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      board[r][c] = randomColor();
    }
  }
}

function hasMoves() {
  const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === -1 || visited[r][c]) continue;
      const group = floodFill(r, c, board[r][c]);
      for (const [gr, gc] of group) visited[gr][gc] = true;
      if (group.length >= 3) return true;
    }
  }
  return false;
}

function ensureMoves() {
  let attempts = 0;
  while (!hasMoves() && attempts < 100) {
    createBoard();
    attempts++;
  }
  if (!hasMoves()) {
    board[0][0] = 0; board[0][1] = 0; board[0][2] = 0;
    board[1][0] = 1; board[1][1] = 1; board[1][2] = 1;
  }
}

function floodFill(r, c, color) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return [];
  if (board[r][c] !== color) return [];
  const group = [];
  const stack = [[r, c]];
  const visited = new Set();
  while (stack.length > 0) {
    const [cr, cc] = stack.pop();
    const key = cr * COLS + cc;
    if (visited.has(key)) continue;
    if (cr < 0 || cr >= ROWS || cc < 0 || cc >= COLS) continue;
    if (board[cr][cc] !== color) continue;
    visited.add(key);
    group.push([cr, cc]);
    stack.push([cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]);
  }
  return group;
}

function getConnectedGroup(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return [];
  if (board[r][c] === -1) return [];
  return floodFill(r, c, board[r][c]);
}

function calcScore(groupSize) {
  return Math.pow(groupSize, 2) * 10;
}

function getComboMultiplier() {
  if (combo <= 1) return 1;
  if (combo <= 3) return 1.5;
  if (combo <= 5) return 2;
  if (combo <= 8) return 3;
  return 4;
}

function applyGravity() {
  const colsAffected = new Set();
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] >= 0) {
        if (writeRow !== r) {
          board[writeRow][c] = board[r][c];
          board[r][c] = -1;
          colsAffected.add(c);
        }
        writeRow--;
      }
    }
    for (let r = writeRow; r >= 0; r--) {
      board[r][c] = randomColor();
      colsAffected.add(c);
    }
  }
  return colsAffected;
}

function compressColumns() {
  const colsAffected = new Set();
  let writeCol = 0;
  for (let c = 0; c < COLS; c++) {
    let hasBlock = false;
    for (let r = 0; r < ROWS; r++) {
      if (board[r][c] >= 0) { hasBlock = true; break; }
    }
    if (hasBlock) {
      if (writeCol !== c) {
        for (let r = 0; r < ROWS; r++) {
          board[r][writeCol] = board[r][c];
          board[r][c] = -1;
        }
        colsAffected.add(writeCol);
      }
      writeCol++;
    }
  }
  for (let c = writeCol; c < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      board[r][c] = randomColor();
    }
    colsAffected.add(c);
  }
  return colsAffected;
}

// ============================================================
// UI 更新（DOM 操作集中在此函数）
// ============================================================
function updateUI() {
  DOM.scoreEl.textContent = score;
  DOM.targetEl.textContent = targetScore;
  DOM.comboEl.textContent = 'x' + combo;
  if (combo > 0) {
    DOM.comboEl.classList.add('combo-active');
    setTimeout(() => DOM.comboEl.classList.remove('combo-active'), 300);
  }
  DOM.maxComboEl.textContent = maxCombo;
  DOM.levelBadge.textContent = '第 ' + level + ' 关';
}

// ============================================================
// Combo 超时
// ============================================================
function resetComboAfterDelay() {
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => {
    combo = 0;
    updateUI();
  }, 2000);
}

// ============================================================
// 关卡
// ============================================================
function checkLevelUp() {
  if (score >= targetScore) {
    level++;
    targetScore = Math.floor(targetScore * 1.8);
    colorCount = getColorCount();
    showToast('恭喜通关！进入第 ' + level + ' 关');
    createBoard();
    ensureMoves();
    drawFrame();
    updateUI();
  }
}

// ============================================================
// 核心点击逻辑
// ============================================================
function onCellClick(r, c) {
  if (anim.phase !== 'idle') return;
  if (board[r][c] === -1) return;

  const group = getConnectedGroup(r, c);
  if (group.length < 3) return;

  clearTimeout(comboTimer);
  moveCount++;

  // 计分
  const basePoints = calcScore(group.length);
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  const multiplier = getComboMultiplier();
  const totalPoints = Math.floor(basePoints * multiplier);

  score += totalPoints;
  updateUI();

  // 飘字（Canvas 坐标）
  const cellX = PADDING + c * (CELL_SIZE + GAP) + CELL_SIZE / 2;
  const cellY = PADDING + r * (CELL_SIZE + GAP);
  addScorePop(cellX, cellY, totalPoints);

  // 保存消除前状态
  anim.prevBoard = board.map(row => [...row]);
  anim.clearedCells = group;

  // 从 board 中清除
  for (const [gr, gc] of group) {
    board[gr][gc] = -1;
  }

  startPhase('popping', 250);
}

// ============================================================
// 重置
// ============================================================
function resetGame() {
  stopAnimation();
  clearTimeout(comboTimer);
  score = 0;
  combo = 0;
  maxCombo = 0;
  level = 1;
  targetScore = 500;
  moveCount = 0;
  createBoard();
  ensureMoves();
  drawFrame();
  updateUI();
}

// ============================================================
// 分享
// ============================================================
function shareScore() {
  const text = '我在「消消方块 - ColorPop」中达到了第 ' + level + ' 关，得分 ' + score + ' 分！最高连击 x' + maxCombo + '！快来挑战我吧！';
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('分享文案已复制到剪贴板！');
    }).catch(() => {
      showToast('分享文案：' + text);
    });
  } else {
    showToast('分享文案：' + text);
  }
}

// ============================================================
// 初始化
// ============================================================
function init() {
  initDOM();
  initCanvas();

  // 绑定事件
  DOM.canvas.addEventListener('click', onCanvasClick);
  DOM.canvas.addEventListener('touchend', onCanvasTouch);

  createBoard();
  ensureMoves();
  drawFrame();
  updateUI();
}

init();
</script>
